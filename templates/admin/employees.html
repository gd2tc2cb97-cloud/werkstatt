{% extends "admin/base.html" %}
{% block admin_content %}
<h1>Mitarbeiter</h1>
<p><a class="button" href="{{ url_for('admin.employee_new') }}">+ Neuer Mitarbeiter</a></p>

<div class="card">
  <table class="table">
    <thead><tr><th>Name</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for e in employees %}
      <tr>
        <td>{{ e.name }}</td>
        <td>{{ 'Aktiv' if e.active else 'Deaktiviert' }}</td>
        <td><a href="{{ url_for('admin.employee_edit', employee_id=e.id) }}">Bearbeiten</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

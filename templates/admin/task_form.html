{% extends "admin/base.html" %}
{% block admin_content %}
<h1>{{ 'Aufgabe bearbeiten' if task else 'Neue Aufgabe' }}</h1>
<div class="card card-narrow">
  <form method="post">
    <label>Titel
      <input type="text" name="title" value="{{ task.title if task else '' }}" required autofocus>
    </label>
    <label>Beschreibung
      <textarea name="description" rows="3">{{ task.description if task else '' }}</textarea>
    </label>
    <label>Fahrzeugkennzeichen
      <input type="text" name="license_plate" value="{{ task.license_plate if task else '' }}" placeholder="z. B. XX-YY 123">
    </label>
    <label>Mitarbeiter
      <select name="employee_id">
        <option value="">– Alle Mitarbeiter –</option>
        {% for e in employees %}
          <option value="{{ e.id }}" {{ 'selected' if task and task.employee_id == e.id else '' }}>{{ e.name }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="row">
      <label>Startdatum
        <input type="date" name="start_date" value="{{ task.start_date if task else '' }}" required>
      </label>
      <label>Enddatum
        <input type="date" name="end_date" value="{{ task.end_date if task else '' }}" required>
      </label>
    </div>
    {% if task %}
    <label>Status
      <select name="status">
        <option value="offen" {{ 'selected' if task.status == 'offen' else '' }}>Offen</option>
        <option value="erledigt" {{ 'selected' if task.status == 'erledigt' else '' }}>Erledigt</option>
      </select>
    </label>
    {% endif %}
    <div class="row">
      <button type="submit">Speichern</button>
      <a class="button secondary" href="{{ url_for('admin.tasks') }}">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
